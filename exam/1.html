// -------------------------
    // Utility: Fisher-Yates shuffle
    // -------------------------
    function shuffleArray(arr){
      for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    shuffleArray(questions);

    // For each question: shuffle options and update answer index
    questions.forEach(q=>{
      const correct = q.options[q.answer];
      shuffleArray(q.options);
      q.answer = q.options.indexOf(correct);
    });


  // Sanskrit digit converter
  function toSanskritNum(num){
    const d=['०','१','२','३','४','५','६','७','८','९'];
    return String(num).split('').map(x=>d[x]).join('');
  }

  // Render quiz
  const quizContainer=document.getElementById('quiz');
  questions.forEach((q,i)=>{
    const d=document.createElement('div');
    d.className='question';
    d.id='q'+(i+1);
    const qNum=toSanskritNum(i+1);
    const total=toSanskritNum(questions.length);
    d.innerHTML=`
      <div class="qtitle"><strong>प्रश्नः ${qNum}.</strong> ${q.text}</div>
      <div class="options">
        ${q.options.map((opt,ji)=>`<div class="opt" data-index="${ji}" onclick="selectOption(${i+1}, this)">${opt}</div>`).join('')}
      </div>
      <div class="meta">प्रश्नः ${qNum} / ${total}</div>
    `;
    quizContainer.appendChild(d);
  });

  // State
  let current=1, answersMap={}, marked=0;

  function showQuestion(n){
    document.querySelectorAll('.question').forEach(el=>el.style.display='none');
    const el=document.getElementById('q'+n);
    if(el) el.style.display='block';
    current=n;
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function updateStatus(){
    const attempted=Object.keys(answersMap).length;
    const notAttempted=questions.length-attempted;
    document.getElementById('status').innerText=
      `प्रयत्नाः : ${toSanskritNum(attempted)} | अनुत्तरितः : ${toSanskritNum(notAttempted)} | पुनर्द्रष्टव्यः : ${toSanskritNum(marked)}`;
  }

  function selectOption(qNum,el){
    document.querySelectorAll(`#q${qNum} .opt`).forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    answersMap[qNum]=el.innerText.trim();
    if(el.innerText.trim()===questions[qNum-1].options[questions[qNum-1].answer]){
      triggerCongrats();
    }
    updateStatus();
  }

  function prevQuestion(){if(current>1)showQuestion(current-1);}
  function nextQuestion(){if(current<questions.length)showQuestion(current+1);}
  function markReview(){marked++;updateStatus();}

  // congrats popup + floating flowers (one-time small shower each correct selection)
    function triggerCongrats(){
      const popup = document.getElementById('congrats');
      popup.classList.add('show');
      setTimeout(()=>popup.classList.remove('show'),1800);

      // spawn flowers
      for(let i=0;i<12;i++){
        const f = document.createElement('div');
        f.className = 'floating-flower';
        const petals = ['🌸','🌺','🌼','💐','🌷'];
        f.innerText = petals[Math.floor(Math.random()*petals.length)];
        f.style.left = (5 + Math.random()*90) + 'vw';
        f.style.fontSize = (18 + Math.random()*26) + 'px';
        // random duration and delay
        const dur = 3 + Math.random()*2.5;
        f.style.animationDuration = dur + 's';
        f.style.animationDelay = (Math.random()*0.3) + 's';
        document.body.appendChild(f);
        setTimeout(()=>f.remove(), (dur+0.4)*1000 + 600);
      }
    }

  function finishExam(){
    let correctCount=0,html='';
    for(let i=0;i<questions.length;i++){
      const qNum=i+1,q=questions[i],correct=q.options[q.answer];
      const given=answersMap[qNum]||null;
      const ok=given!==null && given===correct;
      if(ok)correctCount++;
      html+=`<div class="answer-block">
        <div><strong>प्रश्नः ${toSanskritNum(qNum)}.</strong> ${q.text}</div>
        <p>दत्त उत्तरः: <span class="${ok?'right':'wrong'}">${given||'न दत्त'}</span></p>
        <p>समीचीन उत्तरः: <strong>${correct}</strong></p>
      </div>`;
    }
    const summary=`<div class="summary">योगफलम् : ${toSanskritNum(correctCount)} / ${toSanskritNum(questions.length)}</div>`;
    document.getElementById('answers').innerHTML=summary+html;
    document.getElementById('quiz').style.display='none';
    document.getElementById('results').style.display='block';
  }

  showQuestion(1);
  updateStatus();
  </script>
</body>
</html>
